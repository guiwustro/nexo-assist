services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - nexo-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nexo-db:
