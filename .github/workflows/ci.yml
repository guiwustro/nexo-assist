name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check:
    name: typecheck, lint e unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: integração (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nexo, POSTGRES_PASSWORD: nexo, POSTGRES_DB: nexo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Cria os bancos de teste
        run: PGPASSWORD=nexo psql -h localhost -U nexo -d nexo -f db/init/01-databases.sql
      - run: pnpm test:int

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nexo, POSTGRES_PASSWORD: nexo, POSTGRES_DB: nexo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Cria os bancos de teste
        run: PGPASSWORD=nexo psql -h localhost -U nexo -d nexo -f db/init/01-databases.sql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
